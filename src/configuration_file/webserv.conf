# Portugal

server
{
    listen  8080;
    host    127.0.0.1;#comments
    client_max_body_size    10M;
    error_pages              error_pages;#comments

    location /
    {
        root assets/data/www;
    }#comments

    location /images/
    {
        root assets/data; #comments
    } #comments
}

# Brasil
server
{
    listen  8081;
    host                    127.0.0.1;
    client_max_body_size    10M;
    error_pages              error_pages;

    location /
    {
        root assets/data/www;
    }

    location /images/
    {
        root assets/data;
    }
}
