# WEBSERVER CONFIGURATION FILE #

http
{
    # Portugal
    server
    {
        listen                  8080;
        host                    127.0.0.1;
        client_max_body_size    10M;
        error_pages             assets/data/www/error_pages/;

        location /
        { 
            root assets/data/www;

            methods         GET POST PUT;
            autoindex       on;
            index           directory_list.html;
            upload_path     uploads;
        }

        location /images/
        {
            root assets/data;

            methods         PUT;
            autoindex       off;
            index           directory_list.html;
            upload_path     uploads;

            cgi
            {
                .rs = /usr/bin/cargo;
            }
        }
    }

    # Brasil
    server
    {
        listen                  8081;
        host                    127.0.0.1;
        client_max_body_size    10M;
        error_pages             assets/data/www/error_pages/;

        location /
        {
            root assets/data/www;

            methods         GET POST PUT;
            autoindex       on;
            index           directory_list.html;
            upload_path      images;
        }

        location /images/
        {
            root assets/data;

            methods         PUT;
            autoindex       off;
            index           directory_list.html;
            upload_path     docs;

            cgi
            {
                .rs = /usr/bin/cargo;
            }
        }
    }
}
