# WEBSERVER CONFIGURATION FILE #

http
{
    # Portugal
    server
    {
        listen                  8080;
        listen                  9000;
        host                    127.0.0.1;
        client_max_body_size    10M;
        error_pages             assets/data/www/error_pages/;

        location /
        { 
            root assets/data/www;
        }

        location /images/
        {
            root assets/data;

            cgi
            {
                .rs = /usr/bin/cargo;
            }
        }
    }

    # Brasil
    server
    {
        listen                  8081;
        host                    127.0.0.1;
        client_max_body_size    10M;
        error_pages             assets/data/www/error_pages;

        location /
        {
            root assets/data/www;
        }

        location /images/
        {
            root assets/data;

            cgi
            {
                .rs = /usr/bin/cargo;
            }
        }
    }
}
