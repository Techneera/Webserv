              # WEBSERVER CONFIGURATION FILE #

# The configuration file should be found from the proper dir,
                 #   which is the root of the webserver project repository.
#   If it's not run from there, errors should be sent to the
#   standard output error

                        


     





server
{
    listen  8888;

    location /
    {
        root assets/data/www;
    }

    location /images
    {
        root assets/data;
    }
}
