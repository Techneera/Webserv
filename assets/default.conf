# webserv default configuration
# Paths are relative to the project root.

http
{
    # First website: 127.0.0.1:8080
    server
    {
        listen 8080;
        host 127.0.0.1;
        client_max_body_size 10M;
        error_pages error_pages;

        # Main static website
        location /
        {
            root assets/data/www/homepage;
            methods GET;
            index homepage.html;
            autoindex off;
        }

        # Static images; directory listing is forbidden
        location /images
        {
            root assets/data;
            methods GET;
            index index.html;
            autoindex off;
        }

        # Publicly browsable directory
        location /browse
        {
            root assets/data;
            methods GET;
            index index.html;
            autoindex on;
        }

        # Permanent redirection
        location /old
        {
            root assets/data/www/homepage;
            methods GET;
            return 301 /;
        }

        # File retrieval, upload, and deletion
        location /files
        {
            root assets/data;
            methods GET POST DELETE;
            index index.html;
            autoindex off;
            upload_path assets/data/uploads;
        }

        # Python CGI execution
        location /cgi/
        {
            root assets/data/cgi;
            methods GET POST;
            index index.html;
            autoindex off;

            cgi
            {
                .py = /usr/bin/python3;
            }
        }
    }

    # Second website with independent content: 127.0.0.1:8081
    server
    {
        listen 8081;
        host 127.0.0.1;
        client_max_body_size 2M;
        error_pages error_pages;

        location /
        {
            root assets/data/www_secondary;
            methods GET;
            index index.html;
            autoindex off;
        }

        location /old
        {
            root assets/data/www_secondary;
            methods GET;
            return 302 /;
        }
    }
}
